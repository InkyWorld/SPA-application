services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "False"
    volumes:
      - media:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "False"
    volumes:
      - media:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config worker -l info --concurrency 2

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "False"
      POSTGRES_DB: comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config beat -l info

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - media:/usr/share/nginx/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
